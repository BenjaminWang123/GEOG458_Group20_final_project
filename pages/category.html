<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proportional Circle Map</title>

  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet" />
</head>
<body>

<div id="app"></div>

<script src="../js/main.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
<script src="../js/category.js"></script>

<script>
renderMapPage("app", {
  currentPage: "category",
  pageNumber: "03",
  title: "Proportional Circle Map",
  subtitle: "Explore individual business locations using circle size to represent visit volume.",
  description:
    "This page uses a proportional circle map to show specific business locations. Larger circles represent higher visit counts, making it easier to compare individual places across the city.",
  insights: [
    "Compare individual locations by visit counts",
    "See which places generate the largest traffic volumes",
    "Inspect detailed business information with popups"
  ],
  toolbar: ["Points", "Visit Counts", "Legend"],
  mapId: "category-map",
  panelTitle: "Proportional Circle Dashboard",
  chartId: "category-chart"
});

document.addEventListener("DOMContentLoaded", () => {
  initCategoryTemplate();
});
</script>

</body>
</html>
